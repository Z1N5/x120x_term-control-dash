[general]
# Inactive until the charging-enable command completes TWO confirmations.
control_charging = false
# Separate explicit opt-in; NEVER enabled by the charging-enable command.
automatic_shutdown = false
# Preparing the power-sense INPUT also requires explicit approval.
# Enable with x120x-control enable-monitoring (or either control enable command).
initialise_power_input = false

# Default: stop at 80%; resume at 77%. Dashboard settings can change the target
# (including 100%) with two confirmations, preserving charging control ON/OFF.
max_charge_capacity = 80
# Optional additional voltage ceiling; 0 disables it.
max_voltage = 0

# Only cause shutdown when automatic_shutdown = true.
min_charge_capacity = 20
min_voltage = 3.5
ac_max_downtime = 5
# Legacy setting accepted but ignored: every shutdown trigger acts immediately.
shutdown_grace_seconds = 0

# Minutes since boot, NOT measured battery temperature.
warmup_time = 0
# standard / run_till_minimums / run_till_protect
# Special battery-start policy expires on first return of external power.
no_power_at_start = standard
# Emergency conditions are still gated by automatic_shutdown opt-in.
disable_self_protect = false

poll_seconds = 2
json_report_file = /run/x120x-ups/status.json
# Accepted for compatibility; reports now follow poll_seconds.
json_report_period = 2
battery_report_schedule = 0 * * * *

# Optional separate sensor attached to cells. Requires Adafruit libraries
# and external pull-up resistor. Not installed by default.
# temperature_sensor_type = DHT22,4,NO_PULL_UP
# Fan settings remain under Raspberry Pi OS control.

# Optional outbound alerts, configured via x120x-control enable-telegram.
# Credentials are stored OUTSIDE the repository in a root-only file.
telegram_enabled = false
telegram_config_file = /usr/local/etc/x120x-telegram.json

# Optional heartbeat: 1 = hourly, 24 = once daily. Disabled until confirmed.
telegram_heartbeat_enabled = false
telegram_heartbeat_hours = 24
# First message at the next occurrence of this Pi-local 24-hour clock time.
telegram_heartbeat_start = 09:00
